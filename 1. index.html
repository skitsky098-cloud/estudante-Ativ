
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Sistema de Consulta de Notas</h1>

        <label>Nome do estudante:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label>Nota 1:</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1">

        <button onclick="calcularMedia()">Calcular média</button>
        <button class="limpar" onclick="limpar()">Limpar</button>

        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
